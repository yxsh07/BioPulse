spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/biopulse?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USER:biopulse}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 10MB
server:
  port: ${PORT:8080}
  error:
    include-message: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
biopulse:
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  seed-demo: ${SEED_DEMO:false}
  demo-password: ${DEMO_PASSWORD:}
