services:
  mysql:
    image: mysql:8.4
    command: ["--log-bin-trust-function-creators=1"]
    environment:
      MYSQL_DATABASE: biomedical_dashboard
      MYSQL_USER: biopulse
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'MYSQL_PWD="$$MYSQL_PASSWORD" mysqladmin ping -h localhost -u biopulse --silent']
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    build: .
    ports:
      - "${BIOPULSE_BIND_ADDRESS:-127.0.0.1}:8080:8080"
    environment:
      DB_URL: jdbc:mysql://mysql:3306/biomedical_dashboard?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
      DB_USER: biopulse
      DB_PASSWORD: ${DB_PASSWORD}
      SEED_DEMO: ${SEED_DEMO:-false}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  mysql_data:
