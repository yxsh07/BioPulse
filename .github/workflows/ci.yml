name: Verify BioPulse
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ephemeral-ci-database
          MYSQL_DATABASE: biopulse_demo
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot --silent"
          --health-interval=10s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: chmod +x mvnw && ./mvnw --batch-mode verify
      - working-directory: frontend
        run: npm ci && npm run build && npx playwright install --with-deps chromium
      - name: Run seeded server
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3306/biopulse_demo?connectionTimeZone=UTC
          DB_USER: root
          DB_PASSWORD: ephemeral-ci-database
          SEED_DEMO: 'true'
        run: |
          DEMO_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$DEMO_PASSWORD"
          echo "DEMO_PASSWORD=$DEMO_PASSWORD" >> "$GITHUB_ENV"
          export DEMO_PASSWORD
          java -jar target/biopulse-1.0.0.jar > server.log 2>&1 &
          for i in $(seq 1 60); do if curl -fsS http://localhost:8080/api/v1/health; then exit 0; fi; sleep 1; done
          cat server.log
          exit 1
      - working-directory: frontend
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-results
          path: |
            target/surefire-reports
            target/failsafe-reports
            frontend/test-results
            server.log
